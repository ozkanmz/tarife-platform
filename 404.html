<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — Enerji-Portali</title>
<meta name="robots" content="noindex">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
:root{--bg:#0f1117;--sur:#181c27;--brd:#2a2f42;--acc:#3b82f6;--txt:#e2e8f0;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'IBM Plex Sans',system-ui,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.kutu{max-width:440px}
.logo{margin-bottom:24px}
h1{font-size:22px;font-weight:600;margin-bottom:8px}
p{color:var(--mut);font-size:14px;line-height:1.6;margin-bottom:28px}
a.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;
  padding:10px 22px;border-radius:8px;font-size:14px;font-weight:500;transition:opacity .15s}
a.btn:hover{opacity:.85}
.kod{font-family:'IBM Plex Mono',monospace;color:var(--brd);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="kutu">
  <div class="logo">

      <polygon points="148,58 96,112 124,120 88,190 170,112 138,102" fill="#e8dcc4"/>
    </svg>
  </div>
  <h1>Sayfa Bulunamadı</h1>
  <p>Aradığınız sayfa taşınmış veya hiç var olmamış olabilir.<br>

</html>
