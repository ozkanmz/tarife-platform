<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#181c27"/>
    </linearGradient>
    <linearGradient id="accGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- ince dekoratif kafes çizgileri -->
  <g stroke="#2a2f42" stroke-width="1" opacity="0.5">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- şimşek/veri ikonu -->
  <g transform="translate(100,235) scale(6.5)">
    <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" fill="none" stroke="url(#accGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- başlık -->
  <text x="290" y="270" font-family="IBM Plex Sans, Arial, sans-serif" font-size="58" font-weight="700" fill="#e2e8f0">Tarife &amp; Piyasa</text>
  <text x="290" y="335" font-family="IBM Plex Sans, Arial, sans-serif" font-size="58" font-weight="700" fill="#e2e8f0">Veri Platformu</text>

  <!-- alt açıklama -->
  <text x="290" y="385" font-family="IBM Plex Sans, Arial, sans-serif" font-size="26" fill="#94a3b8">EPDK Tarifeleri · EPİAŞ PTF · YEKDEM — tek panelde</text>

  <!-- alt rozet çubuğu -->
  <g transform="translate(100,520)">
    <rect x="0" y="0" width="230" height="44" rx="22" fill="#1e2233" stroke="#2a2f42"/>
    <circle cx="26" cy="22" r="6" fill="#22c55e"/>
    <text x="42" y="29" font-family="IBM Plex Mono, monospace" font-size="18" fill="#e2e8f0">Otomatik güncel</text>
  </g>

  <text x="1100" y="548" font-family="IBM Plex Mono, monospace" font-size="20" fill="#94a3b8" text-anchor="end">ozkanmz.github.io/tarife-platform</text>
</svg>
